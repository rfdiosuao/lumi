name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openclaw_new_launcher/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        run: |
          rustup default stable
          rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            openclaw_new_launcher/src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('openclaw_new_launcher/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: openclaw_new_launcher
        run: npm ci

      - name: Verify source text
        run: powershell -ExecutionPolicy Bypass -File scripts\verify-source-text.ps1

      - name: Build frontend
        working-directory: openclaw_new_launcher
        run: npm run build

      - name: Check Rust
        working-directory: openclaw_new_launcher/src-tauri
        run: cargo check

      - name: Build Tauri bundles
        working-directory: openclaw_new_launcher
        run: npm run tauri -- build

      - name: Collect release assets
        run: |
          $artifactDir = Join-Path $PWD "ci_artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $bundleDir = Join-Path $PWD "openclaw_new_launcher\src-tauri\target\release\bundle"
          if (-not (Test-Path -LiteralPath $bundleDir)) {
            throw "Tauri bundle output not found: $bundleDir"
          }

          Get-ChildItem -LiteralPath $bundleDir -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".msi", ".zip", ".nsis", ".dmg", ".appimage", ".deb", ".rpm") } |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $artifactDir $_.Name) -Force
            }

          $files = @(Get-ChildItem -LiteralPath $artifactDir -File)
          if ($files.Count -eq 0) {
            throw "No release assets were collected from $bundleDir"
          }

          foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName
            "$($hash.Hash)  $($file.Name)" | Set-Content -LiteralPath "$($file.FullName).sha256.txt" -Encoding ASCII
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-release-assets
          path: ci_artifacts/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Lumi / OpenClaw ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ci_artifacts/*
